name: Build APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build
        run: ./gradlew assembleSmartphoneDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ptt-smartphone-debug
          path: apps/android-ptt/app/build/outputs/apk/smartphone/debug/*.apk   
